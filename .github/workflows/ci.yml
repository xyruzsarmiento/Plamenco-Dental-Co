name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify schema artifacts
        run: npm run verify:schema

      - name: Verify deployment readiness
        run: npm run verify:deployment

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
